    EventCreateRequest:
      type: object
      required:
        - title
        - type
        - startAt
        - endAt
        - location
      properties:
        aziendaId:
          type: string
          description: Campo legacy opzionale supportato dagli alias top-level; non necessario sugli endpoint annidati sotto /api/aziende/{aziendaId}/eventi.
        title:
          type: string
        type:
          type: string
          enum:
            - controllo-sanitario
            - vaccinazione
            - parto-previsto
            - consegna
            - scadenza-documentale
            - vendita
            - altro
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        location:
          type: string
          description: Indirizzo testuale dell'evento
          example: Via Roma 10, Milano
        description:
          type: string
        link:
          type: string
          format: uri
          description: Link opzionale associato all'evento
          example: https://muccapp.it/eventi/open-day
        reminderMinutes:
          type: integer
          minimum: 0
          maximum: 10080
          default: 0
        visibility:
          type: string
          description: Definisce se l'evento e' pubblico o privato. Il valore public rende l'evento visibile negli endpoint pubblici consultabili anche dal consumatore e instrada la sincronizzazione verso il calendario pubblico Google dell'azienda; il valore private lo mantiene nell'area riservata dell'allevatore e nel calendario privato.
          enum:
            - private
            - public
          default: private
        recurrenceType:
          type: string
          enum:
            - single
            - weekly
            - monthly
          default: single
        recurrenceInterval:
          type: integer
          minimum: 1
          maximum: 52
          default: 1
        recurrenceUntil:
          type: string
          format: date
          nullable: true

