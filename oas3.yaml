openapi: 3.0.3
info:
  title: MuccApp API
  description: Documentazione API del backend MuccApp
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Health
    description: Endpoint per verificare lo stato del server
  - name: Auth
    description: Endpoint per la registrazione e autenticazione degli utenti
  - name: Azienda
    description: Endpoint per la registrazione e gestione aziende
  - name: Animale
    description: Endpoint per la registrazione e gestione animali
  - name: Punto vendita
    description: Endpoint per la gestione dei punti vendita associati a un allevatore e per l'esposizione del dataset pubblico attivo
  - name: Evento
    description: Endpoint per la gestione eventi e sincronizzazione Google Calendar
  - name: Lavorazione
    description: Endpoint per la creazione, modifica e consultazione delle lavorazioni (incluse template)
  - name: Mungitura
    description: Endpoint per avvio, chiusura, consultazione ed eliminazione delle mungiture
  - name: Lotto prodotto
    description: Endpoint per la creazione, modifica e consultazione dei lotti prodotto
  - name: Mappa
    description: Endpoint di supporto all'integrazione mappa (configurazione client e dataset pubblico aziende)

paths:
  /api/health:
    get:
      summary: Stato server
      description: Restituisce lo stato del server per verificare che il backend sia raggiungibile e funzionante
      tags:
        - Health
      responses:
        '200':
          description: Server attivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                success:
                  value:
                    message: Server attivo
                    status: ok

  /api/config:
    get:
      summary: Configurazione client
      description: Restituisce la configurazione necessaria al frontend per l'integrazione Google Maps.
      tags:
        - Mappa
      responses:
        '200':
          description: Configurazione disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
              examples:
                success:
                  value:
                    googleMapsKey: AIzaSyD-example-key

  /api/aziende/public:
    get:
      summary: Dataset aziende pubblico
      description: Restituisce la lista pubblica delle aziende con i campi necessari alla visualizzazione in mappa.
      tags:
        - Mappa
        - Azienda
      responses:
        '200':
          description: Lista aziende pubbliche disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AziendaPublicCollection'
              examples:
                success:
                  value:
                    items:
                      - _id: 665f8fd8ad8f8c0012f9c123
                        companyName: Azienda Agricola Rossi
                        address: Via Roma 10, Milano
                        categories:
                          - latte
                          - formaggio
                        emailAzienda: info@azienda-rossi.it
                        phoneNumber: "+39021234567"
                        website: https://www.azienda-rossi.it
                        geo:
                          lat: 45.4642
                          lng: 9.19
                        location:
                          type: Point
                          coordinates:
                            - 9.19
                            - 45.4642
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/aziende/{id}:
    get:
      summary: Informazioni azienda
      description: Restituisce le informazioni dell'azienda.
      tags:
        - Azienda
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID univoco dell'azienda da visualizzare
          schema:
            type: string
            example: 665f8fd8ad8f8c0012f9c123
      responses:
        '200':
          description: Informazioni complete azienda disponibili
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowAziendaResponse'
              examples:
                success:
                  value:
                    items:
                      - _id: 665f8fd8ad8f8c0012f9c123
                        companyName: Azienda Agricola Rossi
                        address: Via Roma 10, Milano
                        categories:
                          - latte
                          - formaggio
                        emailAzienda: info@azienda-rossi.it
                        phoneNumber: "+39021234567"
                        website: https://www.azienda-rossi.it
                        geo:
                          lat: 45.4642
                          lng: 9.19
                        location:
                          type: Point
                          coordinates:
                            - 9.19
                            - 45.4642
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server
    patch:
      summary: Aggiorna informazioni azienda
      description: Modifica i dati di un'azienda esistente di proprietà dell'allevatore autenticato.
      tags:
        - Azienda
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: ID univoco della azienda da modificare
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAziendaRequest'
            examples:
              updateNomeEVat:
                summary: Modifica Ragione Sociale e Partita IVA
                value:
                  companyName: "Nuova Azienda Agricola Rossi"
                  vatNumber: "IT12345687901"
              updateContatti:
                summary: Modifica Email e Indirizzo
                value:
                  emailAzienda: "info@aziendarossi.it"
                  address: "Via delle Margherite 12, Calliano"
      responses:
        '200':
          description: Azienda aggiornata con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  itemInfo:
                    $ref: '#/components/schemas/AziendaCompleted'
              examples:
                success:
                  value:
                    message: "Azienda aggiornata con successo"
                    itemInfo:
                      _id: "665f9fd8ad8f8c0012f9d900"
                      ownerUserId: "665f8d90ad8f8c0012f9b456"
                      vatNumber: "IT12345678901"
                      companyName: "Nuova Azienda Agricola Rossi"
                      emailAzienda: "info@aziendarossi.it"
                      address: "Via delle Margherite 12, Calliano"
                      categories: ["latte", "formaggi"]
        '400':
          description: ID non valido (non rispetta il formato ObjectId di MongoDB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    message: "aziendaId non è un ObjectId valido"
        '401':
          description: Token JWT mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    message: "Token mancante o non valido"
        '403':
          description: L'utente autenticato non è il proprietario dell'azienda o non ha il ruolo 'allevatore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    message: "Non hai i permessi per questa azienda"
        '404':
          description: L'azienda con l'ID specificato non esiste nel database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: "Azienda non trovata"
        '500':
          description: Errore interno del server o del database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: "Errore interno del server"

  /api/punti-vendita/public:
    get:
      summary: Dataset punti vendita pubblico
      description: Restituisce la lista pubblica dei punti vendita attivi. Questo endpoint è pensato per la visualizzazione pubblica e ritorna solo i punti vendita con `isActive=true`, includendo i dati utili alla mappa e alla scheda informativa, senza esporre campi sensibili o informazioni di gestione.
      tags:
        - Mappa
        - Punto vendita
      responses:
        '200':
          description: Lista punti vendita pubblici disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoVenditaPublicCollection'
              examples:
                success:
                  value:
                    items:
                      - _id: 665f9fd8ad8f8c0012f9d900
                        isActive: true
                        nomePunto: Spaccio Aziendale Rossi
                        indirizzo: Via Roma 12, Milano
                        formattedAddress: Via Roma 12, 20121 Milano MI, Italia
                        city: Milano
                        province: MI
                        geo:
                          lat: 45.4642
                          lng: 9.19
                        emailPunto: spaccio@azienda-rossi.it
                        phoneNumber: "+39021234567"
                        website: https://www.azienda-rossi.it/spaccio
                        description: Vendita diretta di latte, formaggi e yogurt prodotti in azienda.
                        categories:
                          - latte
                          - formaggi
                          - yogurt
                        placeId: ChIJg64JgkVKhkcR6Vn4LQ2U8JY
                        createdAt: 2026-05-01T12:00:00.000Z
                        updatedAt: 2026-05-10T12:00:00.000Z
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/punti-vendita:
    post:
      summary: Crea punto vendita
      description: Crea un nuovo punto vendita associato all'allevatore autenticato. Il punto vendita viene creato attivo di default (`isActive=true`) a meno che il client non invii esplicitamente `isActive=false`. Il campo `indirizzo` è la stringa testuale usata per la ricerca, mentre `geo` contiene le coordinate geografiche obbligatorie.
      tags:
        - Punto vendita
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Dati necessari per la creazione di un punto vendita
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePuntoVenditaRequest'
            examples:
              spaccioAziendale:
                summary: Spaccio aziendale attivo
                value:
                  nomePunto: Spaccio Aziendale Rossi
                  indirizzo: Via Roma 12, Milano
                  geo:
                    lat: 45.4642
                    lng: 9.19
                  emailPunto: spaccio@azienda-rossi.it
                  phoneNumber: "+39021234567"
                  website: https://www.azienda-rossi.it/spaccio
                  description: Vendita diretta di latte, formaggi e yogurt prodotti in azienda.
                  categories:
                    - latte
                    - formaggi
                    - yogurt
                  formattedAddress: Via Roma 12, 20121 Milano MI, Italia
                  city: Milano
                  province: MI
                  placeId: ChIJg64JgkVKhkcR6Vn4LQ2U8JY
                  isActive: true
              puntoTemporaneamenteChiuso:
                summary: Punto vendita creato ma non attivo
                value:
                  nomePunto: Mercatino stagionale
                  indirizzo: Piazza Centrale 5, Bergamo
                  geo:
                    lat: 45.6983
                    lng: 9.6773
                  categories:
                    - formaggi
                    - salumi
                  isActive: false
      responses:
        '201':
          description: Punto vendita creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoVenditaResponse'
              examples:
                success:
                  value:
                    message: Punto vendita creato con successo
                    puntoVendita:
                      _id: 665f9fd8ad8f8c0012f9d900
                      ownerUserId: 665f8d90ad8f8c0012f9b456
                      isActive: true
                      nomePunto: Spaccio Aziendale Rossi
                      indirizzo: Via Roma 12, Milano
                      geo:
                        lat: 45.4642
                        lng: 9.19
                      emailPunto: spaccio@azienda-rossi.it
                      phoneNumber: "+39021234567"
                      website: https://www.azienda-rossi.it/spaccio
                      description: Vendita diretta di latte, formaggi e yogurt prodotti in azienda.
                      categories:
                        - latte
                        - formaggi
                        - yogurt
                      formattedAddress: Via Roma 12, 20121 Milano MI, Italia
                      city: Milano
                      province: MI
                      placeId: ChIJg64JgkVKhkcR6Vn4LQ2U8JY
                      createdAt: 2026-05-01T12:00:00.000Z
                      updatedAt: 2026-05-01T12:00:00.000Z
        '400':
          description: Dati non validi o coordinate mancanti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    message: Nome punto e indirizzo sono obbligatori
                invalidGeo:
                  value:
                    message: Coordinate geografiche non valide
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingOrInvalidToken:
                  value:
                    message: "Token mancante o formato non valido: Accesso negato"
        '403':
          description: Permessi insufficienti (solo allevatore)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value:
                    message: "Permessi insufficienti: Accesso negato"
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/punti-vendita/mine:
    get:
      summary: Elenco punti vendita dell'allevatore autenticato
      description: Restituisce tutti i punti vendita associati all'utente autenticato, includendo anche quelli non attivi. L'endpoint è usato dalla vista di gestione per mostrare lo stato, filtrare per nome, indirizzo o categoria e abilitare la modifica inline e l'eliminazione.
      tags:
        - Punto vendita
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista punti vendita dell'utente disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoVenditaListResponse'
              examples:
                success:
                  value:
                    items:
                      - _id: 665f9fd8ad8f8c0012f9d900
                        ownerUserId: 665f8d90ad8f8c0012f9b456
                        isActive: true
                        nomePunto: Spaccio Aziendale Rossi
                        indirizzo: Via Roma 12, Milano
                        geo:
                          lat: 45.4642
                          lng: 9.19
                        emailPunto: spaccio@azienda-rossi.it
                        phoneNumber: "+39021234567"
                        website: https://www.azienda-rossi.it/spaccio
                        description: Vendita diretta di latte, formaggi e yogurt prodotti in azienda.
                        categories:
                          - latte
                          - formaggi
                          - yogurt
                        formattedAddress: Via Roma 12, 20121 Milano MI, Italia
                        city: Milano
                        province: MI
                        placeId: ChIJg64JgkVKhkcR6Vn4LQ2U8JY
                        createdAt: 2026-05-01T12:00:00.000Z
                        updatedAt: 2026-05-10T12:00:00.000Z
                      - _id: 665f9fd8ad8f8c0012f9d901
                        ownerUserId: 665f8d90ad8f8c0012f9b456
                        isActive: false
                        nomePunto: Mercatino stagionale
                        indirizzo: Piazza Centrale 5, Bergamo
                        geo:
                          lat: 45.6983
                          lng: 9.6773
                        categories:
                          - formaggi
                          - salumi
                        city: Bergamo
                        province: BG
                        createdAt: 2026-04-12T08:00:00.000Z
                        updatedAt: 2026-04-20T08:00:00.000Z
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingOrInvalidToken:
                  value:
                    message: "Token mancante o formato non valido: Accesso negato"
        '403':
          description: Permessi insufficienti (solo allevatore)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value:
                    message: "Permessi insufficienti: Accesso negato"
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/punti-vendita/{id}:
    get:
      summary: Dettaglio punto vendita
      description: "Restituisce il dettaglio di un singolo punto vendita dell'utente autenticato. L'endpoint è protetto da controllo di proprietà: se il punto vendita non appartiene all'utente, la richiesta viene respinta."
      tags:
        - Punto vendita
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: ID del punto vendita da recuperare
          schema:
            type: string
      responses:
        '200':
          description: Punto vendita trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoVenditaDetailResponse'
              examples:
                success:
                  value:
                    item:
                      _id: 665f9fd8ad8f8c0012f9d900
                      ownerUserId: 665f8d90ad8f8c0012f9b456
                      isActive: true
                      nomePunto: Spaccio Aziendale Rossi
                      indirizzo: Via Roma 12, Milano
                      geo:
                        lat: 45.4642
                        lng: 9.19
                      emailPunto: spaccio@azienda-rossi.it
                      phoneNumber: "+39021234567"
                      website: https://www.azienda-rossi.it/spaccio
                      description: Vendita diretta di latte, formaggi e yogurt prodotti in azienda.
                      categories:
                        - latte
                        - formaggi
                        - yogurt
                      formattedAddress: Via Roma 12, 20121 Milano MI, Italia
                      city: Milano
                      province: MI
                      placeId: ChIJg64JgkVKhkcR6Vn4LQ2U8JY
                      createdAt: 2026-05-01T12:00:00.000Z
                      updatedAt: 2026-05-10T12:00:00.000Z
        '400':
          description: ID non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    message: ID del punto vendita non valido
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti o punto vendita non di proprietà dell'utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenOwner:
                  value:
                    message: Non sei il proprietario di questo punto vendita
        '404':
          description: Punto vendita non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Punto vendita non trovato

    patch:
      summary: Aggiorna punto vendita
      description: Aggiorna i dati di un punto vendita dell'allevatore autenticato. Tutti i campi sono opzionali, ma almeno uno deve essere presente per ottenere un aggiornamento utile. Il campo `isActive` consente di attivare o disattivare rapidamente la visibilità del punto vendita.
      tags:
        - Punto vendita
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: ID del punto vendita da modificare
          schema:
            type: string
      requestBody:
        required: true
        description: Dati da aggiornare del punto vendita. Tutti i campi sono opzionali, ma almeno uno deve essere presente.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePuntoVenditaRequest'
            examples:
              updateNameAndStatus:
                summary: Cambio nome e disattivazione
                value:
                  nomePunto: Spaccio Rossi Centro
                  isActive: false
              updateAddress:
                summary: Aggiornamento indirizzo e categorie
                value:
                  indirizzo: Via Garibaldi 18, Milano
                  city: Milano
                  province: MI
                  categories:
                    - latte
                    - yogurt
      responses:
        '200':
          description: Punto vendita aggiornato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PuntoVenditaResponse'
              examples:
                success:
                  value:
                    message: Punto vendita aggiornato con successo
                    puntoVendita:
                      _id: 665f9fd8ad8f8c0012f9d900
                      ownerUserId: 665f8d90ad8f8c0012f9b456
                      isActive: false
                      nomePunto: Spaccio Rossi Centro
                      indirizzo: Via Garibaldi 18, Milano
                      geo:
                        lat: 45.4642
                        lng: 9.19
                      categories:
                        - latte
                        - yogurt
                      city: Milano
                      province: MI
        '400':
          description: ID non valido, dati non validi o coordinate non valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    message: ID del punto vendita non valido
                invalidGeo:
                  value:
                    message: Coordinate geografiche non valide
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti o punto vendita non di proprietà dell'utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenOwner:
                  value:
                    message: Non sei il proprietario di questo punto vendita
        '404':
          description: Punto vendita non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Punto vendita non trovato

    delete:
      summary: Elimina punto vendita
      description: Elimina definitivamente un punto vendita appartenente all'allevatore autenticato. L'operazione è irreversibile e rimuove il record dalla gestione dell'utente.
      tags:
        - Punto vendita
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: ID del punto vendita da eliminare
          schema:
            type: string
      responses:
        '200':
          description: Punto vendita eliminato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: Punto vendita eliminato con successo
        '400':
          description: ID non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    message: ID del punto vendita non valido
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti o punto vendita non di proprietà dell'utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenOwner:
                  value:
                    message: Non sei il proprietario di questo punto vendita
        '404':
          description: Punto vendita non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Punto vendita non trovato

  /api/auth/signup:
    post:
      summary: Registra un nuovo utente
      description: Crea un nuovo account utente nel sistema. L'email deve essere univoca e la password viene salvata in forma hashata.
      tags:
        - Auth
      requestBody:
        required: true
        description: Dati necessari per la registrazione di un nuovo utente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              consumatore:
                value:
                  name: Mario
                  surname: Rossi
                  email: mario.rossi@example.com
                  password: Password123
                  userType: consumatore
                  acceptedTerms: true
              allevatore:
                value:
                  name: Marisa
                  surname: Rossi
