                      $ref: '#/components/schemas/EventItem'
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/aziende/{aziendaId}/eventi/sincronizzazioni/google:
    post:
      summary: Crea sincronizzazione Google eventi aziendali
      description: Sincronizza in batch gli eventi dell'azienda con Google Calendar. Gli eventi con visibility uguale a public vengono sincronizzati sul calendario pubblico dell'azienda, mentre quelli con visibility uguale a private vengono sincronizzati sul calendario privato. Endpoint REST noun-based.
      tags:
        - Evento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventSyncAllRequest'
      responses:
        '200':
          description: Sincronizzazione completata
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  result:
                    $ref: '#/components/schemas/EventSyncAllResult'
        '400':
          description: Richiesta non valida o Google Calendar non connesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/aziende/{aziendaId}/eventi/{id}/sincronizzazioni/google:
    post:
      summary: Crea sincronizzazione Google per un evento
      description: Sincronizza un singolo evento su Google Calendar. Se l'evento ha visibility uguale a public viene inviato al calendario pubblico dell'azienda; in caso contrario viene inviato al calendario privato. Endpoint REST noun-based.
      tags:
        - Evento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evento sincronizzato
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: '#/components/schemas/EventItem'
        '400':
          description: ID evento non valido o Google Calendar non connesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Evento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/aziende/{aziendaId}/eventi/{id}:
    delete:
      summary: Elimina evento
      description: Elimina un evento dell'utente autenticato.
      tags:
        - Evento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evento eliminato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: ID evento non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Evento non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClientConfig:
      type: object
      description: Configurazione client per servizi esterni.
      required:
        - googleMapsKey
      properties:
        googleMapsKey:
          type: string
          description: Chiave API Google Maps usata dal frontend.
          example: AIzaSyD-example-key

    GeoPoint:
      type: object
      description: Coordinate geografiche in formato semplificato.
      properties:
        lat:
          type: number
          format: double
          example: 45.4642
        lng:
          type: number
          format: double
          example: 9.19

    GeoLocation:
      type: object
      description: Coordinate geografiche in formato GeoJSON.
      properties:
        type:
          type: string
          example: Point
        coordinates:
          type: array
          description: Coordinate GeoJSON in ordine [lng, lat].
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          example:
            - 9.19
            - 45.4642

    AziendaPublicItem:
      type: object
      description: Dati pubblici di un'azienda per visualizzazione mappa.
      properties:
        _id:
          type: string
          example: 665f8fd8ad8f8c0012f9c123
        companyName:
          type: string
          example: Azienda Agricola Rossi
        address:
          type: string
          example: Via Roma 10, Milano
        categories:
          type: array
          items:
            type: string
          example:
            - latte
            - formaggio
        emailAzienda:
          type: string
          format: email
          example: info@azienda-rossi.it
        phoneNumber:
          type: string
          example: "+39021234567"
        website:
          type: string
          example: https://www.azienda-rossi.it
        geo:
          $ref: '#/components/schemas/GeoPoint'
        location:
          $ref: '#/components/schemas/GeoLocation'

    AziendaPublicCollection:
      type: object
      description: Collezione di aziende pubbliche per la mappa.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AziendaPublicItem'

    HealthResponse:
      type: object
      description: Risposta di stato del server
      properties:
        message:
          type: string
          description: Messaggio descrittivo dello stato del server
          example: Server attivo
        status:
          type: string
          description: Stato sintetico del server
          example: ok

    SignupRequest:
      type: object
      description: Corpo della richiesta per la registrazione di un utente
      required:
        - name
        - surname
        - email
        - password
        - userType
        - acceptedTerms
      properties:
        name:
          type: string
          description: Nome dell'utente
          minLength: 1
          example: Mario
        surname:
          type: string
          description: Cognome dell'utente
          minLength: 1
          example: Rossi
        email:
          type: string
          format: email
          description: Indirizzo email univoco dell'utente
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          description: Password in chiaro inviata dal client; verrà hashata dal server prima del salvataggio
          minLength: 8
          example: Password123
        userType:
          type: string
          description: Tipologia dell'utente registrato
          enum:
            - allevatore
            - distributore
            - veterinario
            - consumatore
          example: consumatore
        acceptedTerms:
          type: boolean
          description: Indica se l'utente ha accettato o meno i Termini e Condizioni
          example: true

    MessageResponse:
      type: object
      description: Risposta generica di successo
      properties:
        message:
          type: string
          description: Messaggio di conferma dell'operazione
          example: Utente registrato con successo

    ErrorResponse:
      type: object
      description: Risposta generica di errore
      properties:
        message:
          type: string
          description: Messaggio che descrive l'errore
          example: Errore interno del server

    LoginRequest:
      type: object
      description: Corpo della richiesta per l'autenticazione di un utente
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email dell'utente registrato
          example: mario.rossi@example.com
        password:
          type: string
          format: password
          description: Password dell'utente registrato
          example: Password123

    LoginResponse:
      type: object
      description: Risposta alla richiesta di login
      properties:
        message:
          type: string
          description: Messaggio di conferma dell'autenticazione
          example: Login effettuato con successo
        token:
          type: string
          description: JWT restituito dal server per autenticare le richieste successive.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        email:
          type: string
          format: email
          description: Email dell'utente autenticato
          example: mario.rossi@example.com
        id:
          type: string
          description: Identificativo dell'utente autenticato
          example: 665f8d90ad8f8c0012f9b456
        userType:
          type: string
          description: Ruolo dell'utente autenticato.
          enum:
            - allevatore
            - distributore
            - veterinario
            - consumatore
          example: allevatore

    ForgotPasswordResponse:
      type: object
      description: Risposta alla richiesta di cambio password.
      properties:
        message:
          type: string
          description: Messaggio di conferma della ricezione della richiesta di cambio password.
          example: Email inserita correttamente, riceverai istruzioni per reimpostare la password.
        token:
          type: string
          description: Token per la reimpostazione della password di breve durata (10 minuti).
          example: hjkfgyfdtserfg6r5r6uhgvcfdr56y

    CreateAziendaRequest:
      type: object
      description: Corpo della richiesta per la creazione di una nuova azienda
      required:
        - companyName
        - address
        - vatNumber
        - emailAzienda
      properties:
        companyName:
          type: string
          description: Nome dell'azienda
          minLength: 1
          example: Azienda Agricola Rossi
        address:
          type: string
          description: Indirizzo della sede aziendale
          minLength: 1
          example: Via Roma 10, Milano
        vatNumber:
          type: string
          description: Partita IVA dell'azienda
          minLength: 1
          maxLength: 13
          example: IT12345678901
          pattern: ^IT\d{11}$  # Validazione della partita IVA italiana
        emailAzienda:
