openapi: 3.0.3
info:
  title: MuccApp API
  description: Documentazione API del backend MuccApp
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development server

tags:
  - name: Health
    description: Endpoint per verificare lo stato del server
  - name: Auth
    description: Endpoint per la registrazione e autenticazione degli utenti
  - name: Azienda
    description: Endpoint per la registrazione e gestione aziende
  - name: Animale
    description: Endpoint per la registrazione e gestione animali
  - name: Evento
    description: Endpoint per la gestione eventi e sincronizzazione Google Calendar
  - name: Mappa
    description: Endpoint di supporto all'integrazione mappa (configurazione client e dataset pubblico aziende)

paths:
  /api/health:
    get:
      summary: Stato server
      description: Restituisce lo stato del server per verificare che il backend sia raggiungibile e funzionante
      tags:
        - Health
      responses:
        '200':
          description: Server attivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                success:
                  value:
                    message: Server attivo
                    status: ok

  /api/config:
    get:
      summary: Configurazione client
      description: Restituisce la configurazione necessaria al frontend per l'integrazione Google Maps.
      tags:
        - Mappa
      responses:
        '200':
          description: Configurazione disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfig'
              examples:
                success:
                  value:
                    googleMapsKey: AIzaSyD-example-key

  /api/aziende/public:
    get:
      summary: Dataset aziende pubblico
      description: Restituisce la lista pubblica delle aziende con i campi necessari alla visualizzazione in mappa.
      tags:
        - Mappa
        - Azienda
      responses:
        '200':
          description: Lista aziende pubbliche disponibile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AziendaPublicCollection'
              examples:
                success:
                  value:
                    items:
                      - _id: 665f8fd8ad8f8c0012f9c123
                        companyName: Azienda Agricola Rossi
                        address: Via Roma 10, Milano
                        categories:
                          - latte
                          - formaggio
                        emailAzienda: info@azienda-rossi.it
                        phoneNumber: "+39021234567"
                        website: https://www.azienda-rossi.it
                        geo:
                          lat: 45.4642
                          lng: 9.19
                        location:
                          type: Point
                          coordinates:
                            - 9.19
                            - 45.4642
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/auth/signup:
    post:
      summary: Registra un nuovo utente
      description: Crea un nuovo account utente nel sistema. L'email deve essere univoca e la password viene salvata in forma hashata.
      tags:
        - Auth
      requestBody:
        required: true
        description: Dati necessari per la registrazione di un nuovo utente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              consumatore:
                value:
                  name: Mario
                  surname: Rossi
                  email: mario.rossi@example.com
                  password: Password123
                  userType: consumatore
                  acceptedTerms: true
              allevatore:
                value:
                  name: Marisa
                  surname: Rossi
                  email: marisa.rossi@example.com
                  password: Password123
                  userType: allevatore
                  acceptedTerms: true
              distributore:
                value:
                  name: Luca
                  surname: Verdi
                  email: luca.verdi@example.com
                  password: Password123
                  userType: distributore
                  acceptedTerms: true
              veterinario:
                value:
                  name: Laura
                  surname: Bianchi
                  email: laura.bianchi@example.com
                  password: Password123
                  userType: veterinario
                  acceptedTerms: true

      responses:
        '201':
          description: Utente registrato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: Utente registrato con successo

        '400':
          description: Dati mancanti o non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    message: Nome, cognome, email, password e ruolo sono obbligatori
                invalidUserType:
                  value:
                    message: ruolo non valido.
                invalidEmail:
                  value:
                    message: Email non valida.
                invalidPassword:
                  value:
                    message: La password deve essere lunga almeno 8 caratteri.
                termsNotAccepted:
                  value:
                    message: È necessario accettare i Termini e Condizioni per registrarsi.

        '409':
          description: Utente già esistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateEmail:
                  value:
                    message: Utente già esistente

        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/auth/login:
    post:
      summary: Autentica un utente
      description: Verifica le credenziali dell'utente e restituisce un token JWT per accedere all'applicazione.
      tags:
        - Auth
      requestBody:
        required: true
        description: Credenziali necessarie per il login.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              consumatore:
                value:
                  email: mario.rossi@example.com
                  password: Password123
              allevatore:
                value:
                  email: marisa.rossi@example.com
                  password: Password123
              distributore:
                value:
                  email: luca.verdi@example.com
                  password: Password123
              veterinario:
                value:
                  email: laura.bianchi@example.com
                  password: Password123
      responses:
        '200':
          description: Login effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    message: Login effettuato con successo
                    token: jwt-token-di-esempio
                    email: mario.rossi@example.com
                    id: 665f8d90ad8f8c0012f9b456
                    userType: allevatore
        '400':
          description: Email e password sono obbligatorie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    message: Email e password sono obbligatorie
        '401':
          description: Credenziali non valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  value:
                    message: Email non valida
                invalidPassword:
                  value:
                    message: Password non valida
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/auth/logout:
    post:
      summary: Disconnette un utente
      description: Effettua il logout dell'utente. In questa versione il token viene rimosso lato client; la revoca server-side sarà gestita in una fase successiva.
      tags:
        - Auth
      responses:
        '200':
          description: Logout effettuato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: Logout effettuato con successo
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/auth/forgot-password:
    post:
      summary: Richiesta di reset password
      description: Permette agli utenti di richiedere un reset della password fornendo la propria email. In questa versione non è implementato un sistema di invio email, ma sarà aggiunto in futuro.
      tags:
        - Auth
      requestBody:
        required: true
        description: Dati necessari per richiedere il reset della password
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email dell'utente che richiede il reset della password
                  example: mario.rossi@example.com
      responses:
        '200':
          description: Richiesta di reset password ricevuta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
              examples:
                success:
                  value:
                    message: Email inserita correttamente, riceverai istruzioni per reimpostare la password
                    token: hjkfgyfdtserfg6r5r6uhgvcfdr56y
        '400':
          description: Dati mancanti o non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    message: Email è obbligatoria
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    message: Utente non trovato
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/auth/reset-password:
    post:
      summary: Reset della password
      description: Permette agli utenti di reimpostare la propria password fornendo l'email e una nuova password.
      tags:
        - Auth
      requestBody:
        required: true
        description: Dati necessari per il reset della password
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  description: Email dell'utente che richiede il reset della password
                  example: mario.rossi@example.com
                newPassword:
                  type: string
                  format: password
                  description: Nuova password dell'utente
                  example: NuovaPassword123
      responses:
        '200':
          description: Password aggiornata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: Password aggiornata con successo
        '400':
          description: Dati mancanti o non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    message: Email e newPassword sono obbligatori
                weakPassword:
                  value:
                    message: La nuova password deve essere lunga almeno 8 caratteri.
        '404':
          description: Utente non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value:
                    message: Utente non trovato
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: Errore interno del server

  /api/aziende:
    post:
      summary: Profilo azienda
      description: Permette a un allevatore autenticato di registrare una o più aziende associate al proprio account. L'accesso è riservato al solo ruolo allevatore; gli altri userType ricevono un errore di autorizzazione.
      tags:
        - Azienda
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Dati necessari per la creazione dell'azienda.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAziendaRequest'
            examples:
              example1:
                value:
                  companyName: Azienda Agricola Rossi
                  address: Via Roma 10, Milano
                  vatNumber: IT12345678901
                  emailAzienda: info@azienda-rossi.it
                  phoneNumber: "+39021234567"
                  website: https://www.azienda-rossi.it
      responses:
        '201':
          description: Azienda creata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AziendaResponse'
              examples:
                success:
                  value:
                    message: "Azienda registrata con successo"
                    company:
                      id: "665f8fd8ad8f8c0012f9c123"
                      ownerUserId: "665f8d90ad8f8c0012f9b456"
                      vatNumber: "IT12345678901"
                      companyName: "Azienda Agricola Rossi"
                      emailAzienda: "info@azienda-rossi.it"
                      address: "Via Roma 10, Milano"
                      phoneNumber: "+39021234567"
                      website: "https://www.azienda-rossi.it"
        '400':
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    message: "Partita IVA, nome azienda, email azienda e indirizzo sono obbligatori"
                invalidEmail:
                  value:
                    message: "Email azienda non valida."
        '409':
          description: Azienda già esistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateVatNumber:
                  value:
                    message: "Esiste già un’azienda con questa partita IVA"
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  value:
                    message: "Errore interno del server"
  
  /api/aziende/{id}:
    delete:
      summary: Rimozione azienda
      description: Elimina l'azienda identificata dall'id specificato.
      tags:
        - Azienda
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: ID dell'azienda da eliminare
          schema:
            type: string
      responses:
        '200':
          description: Azienda eliminata con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: Azienda eliminata con successo
        '400':
          description: ID azienda non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    message: ID azienda non valido
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingOrInvalidToken:
                  value:
                    message: "Token mancante o formato non valido: Accesso negato"
        '403':
          description: Permessi insufficienti (solo allevatore)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value:
                    message: "Permessi insufficienti: Accesso negato"
        '404':
          description: Azienda non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Azienda non trovata

        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              
  /api/aziende/{aziendaId}/animali:
    post:
      summary: Anagrafica animale aziendale
      description: Endpoint consigliato. Permette a un allevatore autenticato di registrare un animale nell'azienda indicata nel path.
      tags:
        - Animale
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          description: ID dell'azienda a cui associare l'animale
          schema:
            type: string
      requestBody:
        required: true
        description: Dati necessari per la registrazione dell'animale.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnimaleInAziendaRequest'
            examples:
              Mucca Stella:
                value:
                  matricola: ITA00123
                  name: Stella
                  species: mucca
                  dataNascita: 2022-03-10
                  sesso: femmina
                  razza: frisona
                  figliaDi: ITA00099
                  note: primo parto regolare

              Mucca Luna:
                value:
                  matricola: ITA00124
                  name: Luna
                  species: mucca
                  dataNascita: 2023-06-15
                  sesso: femmina
                  razza: frisona
                  figliaDi: ITA00099
                  note: prima gravidanza, monitorare attentamente
      responses:
        '201':
          description: Animale registrato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimaleResponse'
              examples:
                success:
                  value:
                    message: "Animale registrato con successo"
                    animale:
                      _id: "665f8fd8ad8f8c0012f9c456"
                      matricola: "ITA00123"
                      name: "Stella"
                      species: "mucca"
                      dataNascita: "2022-03-10T00:00:00.000Z"
                      sesso: "femmina"
                      razza: "frisona"
                      figliaDi: "ITA00099"
                      aziendaId: "665f8fd8ad8f8c0012f9c123"
                      note: "primo parto regolare"
        '400':
          description: Dati non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    message: "Matricola, name, species, dataNascita, sesso e aziendaId sono obbligatori"
                invalidData:
                  value:
                    message: "Dati animale non validi"
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingOrInvalidToken:
                  value:
                    message: "Token mancante o formato non valido: Accesso negato"
        '403':
          description: Permessi insufficienti o azienda non di proprietà dell'utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value:
                    message: "Permessi insufficienti: Accesso negato"
                forbiddenOwnership:
                  value:
                    message: "Non hai i permessi per questa azienda"
        '404':
          description: Azienda non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Azienda non trovata
        '409':
          description: Animale già esistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateMatricola:
                  value:
                    message: "Esiste già un animale con questa matricola"
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Mandria aziendale
      description: Endpoint consigliato. Restituisce l'elenco paginato degli animali dell'azienda selezionata con supporto a filtri per colonna e ordinamento.
      tags:
        - Animale
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          description: ID dell'azienda di cui visualizzare la mandria
          schema:
            type: string
        - in: query
          name: matricola
          required: false
          description: Filtro testuale per matricola (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: name
          required: false
          description: Filtro testuale per nome animale (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: species
          required: false
          description: Filtro esatto per specie
          schema:
            type: string
            enum:
              - mucca
              - pecora
              - capra
              - pollo
              - coniglio
        - in: query
          name: sesso
          required: false
          description: Filtro esatto per sesso
          schema:
            type: string
            enum:
              - maschio
              - femmina
        - in: query
          name: razza
          required: false
          description: Filtro testuale per razza (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: figliaDi
          required: false
          description: Filtro testuale per matricola madre (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: note
          required: false
          description: Filtro testuale per note (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: dataNascitaDa
          required: false
          description: Limite inferiore data di nascita (inclusivo)
          schema:
            type: string
            format: date
        - in: query
          name: dataNascitaA
          required: false
          description: Limite superiore data di nascita (inclusivo)
          schema:
            type: string
            format: date
        - in: query
          name: sortBy
          required: false
          description: Campo di ordinamento
          schema:
            type: string
            enum:
              - matricola
              - name
              - species
              - dataNascita
              - sesso
              - razza
              - createdAt
            default: createdAt
        - in: query
          name: sortOrder
          required: false
          description: Direzione ordinamento
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - in: query
          name: page
          required: false
          description: Numero pagina (minimo 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          description: Numero massimo elementi per pagina (minimo 1)
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Elenco animali recuperato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimaliListResponse'
              examples:
                success:
                  value:
                    items:
                      - _id: 665f9f10ad8f8c0012f9d111
                        matricola: IT001BG001
                        name: Margherita
                        species: mucca
                        dataNascita: 2019-03-12T00:00:00.000Z
                        sesso: femmina
                        razza: Frisona
                        figliaDi: null
                        aziendaId: 665f8fd8ad8f8c0012f9c123
                        note: Alta produzione di latte
                    pagination:
                      page: 1
                      limit: 10
                      totalItems: 20
                      totalPages: 2
        '400':
          description: aziendaId non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidAziendaId:
                  value:
                    message: "aziendaId non è un ObjectId valido"
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingOrInvalidToken:
                  value:
                    message: "Token mancante o formato non valido: Accesso negato"
        '403':
          description: Permessi insufficienti (solo allevatore o azienda non di proprietà)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value:
                    message: "Permessi insufficienti: Accesso negato"
        '404':
          description: Azienda non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Azienda non trovata
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
 
  /api/aziende/{aziendaId}/animali/{id}:
    patch:
      summary: Aggiornamento animale
      description: Modifica i dati dell'animale identificato dall'id specificato. L'aziendaId nel path viene usata solo per verificare che l'animale appartenga all'azienda di proprietà dell'utente autenticato. I campi matricola, aziendaId e _id non sono modificabili.
      tags:
        - Animale
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          description: ID dell'azienda proprietaria dell'animale
          schema:
            type: string
        - in: path
          name: id
          required: true
          description: ID dell'animale da modificare
          schema:
            type: string
      requestBody:
        required: true
        description: Dati da aggiornare dell'animale. Tutti i campi sono opzionali, ma almeno uno deve essere presente.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnimalRequest'
            examples:
              updateNameAndNote:
                value:
                  name: Stella Nuova
                  note: "Aggiornamento nome e note"
              updateRazza:
                value:
                  razza: Jersey
      responses:
        '200':
          description: Animale modificato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animale'
              examples:
                success:
                  value:
                    _id: 6a0b3d8a5695e23292cb349d
                    matricola: MAT001
                    name: Stella Nuova
                    aziendaId: 6a0b3d0b5695e23292cb349c
                    species: Bos taurus
                    razza: Jersey
                    dataNascita: '2020-01-15'
                    sesso: F
                    figliaDi: null
                    note: "Aggiornamento nome e note"
                    createdAt: '2025-05-18T10:30:00.000Z'
                    updatedAt: '2025-05-18T14:45:00.000Z'
        '400':
          description: ID animale non valido o dati non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    message: ID animale non valido
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    message: Non autorizzato
        '403':
          description: L'animale non appartiene all'azienda dell'utente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbidden:
                  value:
                    message: L'animale non appartiene a questa azienda
        '404':
          description: Azienda o animale non trovati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Animale non trovato
    delete:
      summary: Rimozione animale
      description: Elimina l'animale identificato dall'id specificato.
      tags:
        - Animale
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          description: ID dell'azienda proprietaria dell'animale
          schema:
            type: string
        - in: path
          name: id
          required: true
          description: ID dell'animale da eliminare
          schema:
            type: string
      responses:
        '200':
          description: Animale eliminato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              examples:
                success:
                  value:
                    message: Animale eliminato con successo
        '400':
          description: ID animale non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  value:
                    message: ID animale non valido
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingOrInvalidToken:
                  value:
                    message: "Token mancante o formato non valido: Accesso negato"
        '403':
          description: Permessi insufficienti (solo allevatore o animale non appartenente all'azienda)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                forbiddenRole:
                  value:
                    message: "Permessi insufficienti: Accesso negato"
                forbiddenOwnership:
                  value:
                    message: "Questo animale non appartiene alla tua azienda"
        '404':
          description: Animale non trovato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    message: Animale non trovato

        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/aziende/{aziendaId}/eventi:
    post:
      summary: Crea evento
      description: Crea un nuovo evento associato all'azienda indicata nel path. L'operazione e' consentita solo a un allevatore autenticato proprietario dell'azienda. Il campo visibility determina se l'evento resta privato oppure viene pubblicato anche nel calendario pubblico dell'azienda; gli eventi privati restano visibili solo nell'area riservata dell'allevatore e nel calendario privato.
      tags:
        - Evento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
            examples:
              temporaneoPubblico:
                summary: Evento temporaneo pubblico
                value:
                  title: Mercato locale prodotti freschi
                  type: vendita
                  startAt: '2026-06-10T08:00:00.000Z'
                  endAt: '2026-06-10T12:00:00.000Z'
                  location: Via Roma 10, Milano
                  description: Vendita aperta al pubblico
                  link: https://muccapp.it/eventi/mercato-locale
                  reminderMinutes: 30
                  visibility: public
                  recurrenceType: weekly
                  recurrenceInterval: 1
                  recurrenceUntil: '2026-09-30'
              singoloPrivato:
                summary: Evento singolo privato
                value:
                  title: Controllo sanitario interno
                  type: controllo-sanitario
                  startAt: '2026-06-03T09:00:00.000Z'
                  endAt: '2026-06-03T10:00:00.000Z'
                  location: Via Roma 10, Milano
                  description: Visita veterinaria in stalla
                  link: https://muccapp.it/eventi/controllo-sanitario-interno
                  reminderMinutes: 10
                  visibility: private
                  recurrenceType: single
                  recurrenceInterval: 1
      responses:
        '201':
          description: Evento creato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  item:
                    $ref: '#/components/schemas/EventItem'
        '400':
          description: Dati evento non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Lista eventi azienda
      description: Restituisce gli eventi dell'azienda selezionata nel path.
      tags:
        - Evento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          schema:
            type: string
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Lista eventi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Parametri non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token mancante, non valido o scaduto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permessi insufficienti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/eventi/pubblici:
    get:
      summary: Lista eventi pubblici
      description: Restituisce solo gli eventi futuri con visibility uguale a public. Questi eventi sono consultabili anche dai consumatori non autenticati; gli eventi privati non sono esposti da questo endpoint. Supporta filtri per azienda, citta e data.
      tags:
        - Evento
      parameters:
        - in: query
          name: aziendaId
          required: false
          description: Filtra gli eventi pubblici di una specifica azienda
          schema:
            type: string
        - in: query
          name: city
          required: false
          description: Filtra gli eventi pubblici per citta dell'azienda
          schema:
            type: string
        - in: query
          name: date
          required: false
          description: Filtra gli eventi che iniziano nella data indicata
          schema:
            type: string
            format: date
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Lista eventi pubblici
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Parametri filtro non validi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Azienda non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/aziende/{aziendaId}/eventi/pubblici:
    get:
      summary: Lista eventi pubblici di una azienda
      description: Restituisce solo gli eventi futuri con visibility uguale a public della singola azienda indicata. Questi eventi sono consultabili anche dai consumatori non autenticati; gli eventi privati dell'azienda non sono esposti da questo endpoint. Supporta filtri opzionali per citta e data.
      tags:
