    get:
      summary: Mandria aziendale
      description: Endpoint consigliato. Restituisce l'elenco paginato degli animali dell'azienda selezionata con supporto a filtri per colonna e ordinamento.
      tags:
        - Animale
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          description: ID dell'azienda di cui visualizzare la mandria
          schema:
            type: string
        - in: query
          name: matricola
          required: false
          description: Filtro testuale per matricola (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: name
          required: false
          description: Filtro testuale per nome animale (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: species
          required: false
          description: Filtro esatto per specie
          schema:
            type: string
            enum:
              - mucca
              - pecora
              - capra
              - pollo
              - coniglio
        - in: query
          name: sesso
          required: false
          description: Filtro esatto per sesso
          schema:
            type: string
            enum:
              - maschio
              - femmina
        - in: query
          name: razza
          required: false
          description: Filtro testuale per razza (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: figliaDi
          required: false
          description: Filtro testuale per matricola madre (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: note
          required: false
          description: Filtro testuale per note (contains, case-insensitive)
          schema:
            type: string
        - in: query
          name: dataNascitaDa
          required: false
          description: Limite inferiore data di nascita (inclusivo)
          schema:
            type: string
            format: date
        - in: query
          name: dataNascitaA
          required: false
          description: Limite superiore data di nascita (inclusivo)
          schema:
            type: string
            format: date
        - in: query
          name: sortBy
          required: false
          description: Campo di ordinamento
          schema:
            type: string
            enum:
              - matricola
              - name
              - species
              - dataNascita
              - sesso
              - razza
              - createdAt
            default: createdAt
        - in: query
          name: sortOrder
          required: false
          description: Direzione ordinamento
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - in: query
          name: page
          required: false
          description: Numero pagina (minimo 1)
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          description: Numero massimo elementi per pagina (minimo 1)
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: Elenco animali recuperato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnimaliListResponse'
              examples:
