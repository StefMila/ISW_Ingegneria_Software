  /api/iot/sensori:
    post:
      summary: Registra (collega) un nuovo sensore
      description: Consente a un allevatore di collegare un nuovo dispositivo IoT specificando le capacità di misurazione.
      tags:
        - IoT Sensori
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - tipoDispositivo
                - capacita
                - aziendaId
              properties:
                nome:
                  type: string
                  example: "Collare Mucca Carolina"
                tipoDispositivo:
                  type: string
                  enum: [ambientale, indossabile, stoccaggio, pesatura]
                  example: "indossabile"
                capacita:
                  type: array
                  description: Array delle metriche supportate dal dispositivo
                  items:
                    type: object
                    properties:
                      tipoDato:
                        type: string
                        enum: [temperatura, frequenza_cardiaca, livello_passi, esposizione_solare, posizione_gps]
                      unitaMisura:
                        type: string
                        enum: ['°C', 'bpm', 'passi', 'ore', 'coordinate']
                aziendaId:
                  type: string
                  example: "654321abc123456def789012"
                animaleId:
                  type: string
                  example: "665c4d2e8b1a2c3d4e5f6g99"
      responses:
        '201':
          description: Sensore collegato con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  
                  item:
                    type: object
                   # Ritorna il sensore creato con l'array capacita

    get:
      summary: Visualizza i dispositivi collegati
      description: Recupera la lista di tutti i sensori registrati per l'azienda.
      tags:
        - IoT Sensori
      parameters:
        - in: query
          name: aziendaId
          schema: 
            type: string
          
          required: true
      responses:
        '200':
          description: Lista dei sensori recuperata
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object # Ora include l'array "capacita"

  /api/iot/sensori/dati:
    get:
      summary: Visualizza letture sensori in tempo reale
      description: Restituisce l'ultimo set di letture JSON aggregate per ogni sensore.
      tags:
        - IoT Sensori
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: aziendaId
          schema: 
            type: string
          
          required: true
      responses:
        '200':
          description: Letture dei sensori recuperate con successo
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp: 
                    type: string, format: date-time
                    
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sensoreId: 
                          type: string
                        
                        nome: 
                          type: string 
                        
                        capacita: 
                          type: array
                         # Le capacità dichiarate
                        valori: 
                          type: object # L'oggetto JSON dinamico arrivato da MQTT
                          description: "es. { 'temperatura': 38.5, 'frequenza_cardiaca': 60 }"
                        ultimoAggiornamento: 
                          type: string, 
                          format: date-time 
                        

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClientConfig:
      type: object
      description: Configurazione client per servizi esterni.
      required:
        - googleMapsKey
      properties:
        googleMapsKey:
          type: string
          description: Chiave API Google Maps usata dal frontend.
          example: AIzaSyD-example-key

    GeoPoint:
      type: object
      description: Coordinate geografiche in formato semplificato.
      properties:
        lat:
          type: number
          format: double
          example: 45.4642
        lng:
          type: number
          format: double
          example: 9.19

    GeoLocation:
      type: object
      description: Coordinate geografiche in formato GeoJSON.
      properties:
        type:
          type: string
          example: Point
        coordinates:
          type: array
          description: Coordinate GeoJSON in ordine [lng, lat].
          minItems: 2
          maxItems: 2
          items:
            type: number
            format: double
          example:
            - 9.19
            - 45.4642

    AziendaPublicItem:
      type: object
      description: Dati pubblici di un'azienda per visualizzazione mappa.
      properties:
        _id:
          type: string
          example: 665f8fd8ad8f8c0012f9c123
        companyName:
          type: string
          example: Azienda Agricola Rossi
        address:
          type: string
          example: Via Roma 10, Milano
        categories:
          type: array
          items:
            type: string
          example:
            - latte
            - formaggio
        emailAzienda:
          type: string
          format: email
          example: info@azienda-rossi.it
        phoneNumber:
          type: string
          example: "+39021234567"
        website:
          type: string
          example: https://www.azienda-rossi.it
        geo:
          $ref: '#/components/schemas/GeoPoint'
        location:
          $ref: '#/components/schemas/GeoLocation'

