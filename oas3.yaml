        - in: path
          name: aziendaId
          required: true
          schema:
            type: string
        - in: query
          name: city
          required: false
          description: Verifica che l'evento appartenga a un'azienda della citta indicata
          schema:
            type: string
        - in: query
          name: date
          required: false
          description: Filtra gli eventi che iniziano nella data indicata
          schema:
            type: string
            format: date
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Lista eventi pubblici aziendali
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: aziendaId non valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Azienda non trovata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Errore interno del server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/aziende/{aziendaId}/eventi/upcoming:
    get:
      summary: Prossimi eventi
      description: Restituisce i prossimi eventi (non conclusi) dell'azienda selezionata nel path.
      tags:
        - Evento
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: aziendaId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Prossimi eventi
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
