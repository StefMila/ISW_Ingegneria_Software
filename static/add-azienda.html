<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title >Aggiungi Azienda - MuccApp</title>
  <!-- Controllo accesso alla pagina, solo gli utenti con ruolo "allevatore" possono accedervi -->
  <script src="/auth-control.js"></script> 
  <script>
    protectRoute(['allevatore']);
  </script>
    <script src="/menu-allevatore.js"></script>
  <!-- Fine controllo accesso -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Struttura simile a add-animale.html, con form per inserire i dati dell'azienda agricola -->
    <main class="dashboard-container">
        <div id="allevatoreHeaderMount"></div>
        <script>
            window.renderAllevatoreHeader({
                showHomeLink: true,
                showEventMenu: false,
                titleText: 'Aggiungi Azienda 🚜'
            });
        </script>
        <section id="section-azienda" class="section">
            <form id="add-azienda-form" class="form">
                <label for="nomeAzienda">Nome Azienda:</label>
                <input type="text" id="nomeAzienda" name="nomeAzienda" placeholder="Inserisci il nome dell'azienda" required>

                <label for="indirizzo">Indirizzo (opzionale):</label>
                <!-- Campo indirizzo con autocompletamento Google Places -->
                <input type="text" id="indirizzo" name="indirizzo" placeholder="Inizia a digitare l'indirizzo..." autocomplete="off">
                <!-- Pulsante per usare la posizione attuale del dispositivo -->
                <button type="button" id="getLocationBtn">Usa la mia posizione attuale</button>
                <!-- Campi nascosti per latitudine e longitudine -->
                <input type="hidden" id="lat" name="lat">
                <input type="hidden" id="lng" name="lng">

                <label for="partitaIva">Partita IVA:</label>
                <input type="text" id="partitaIva" name="partitaIva" placeholder="Inserisci la partita IVA dell'azienda" required>

                <label for="telefono">Telefono:</label>
                <input type="text" id="telefono" name="telefono" placeholder="Inserisci il numero di telefono dell'azienda" >
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Inserisci l'email dell'azienda" >

                <label for="website">Sito Web:</label>
                <input type="url" id="website" name="website" placeholder="Inserisci il sito web dell'azienda" >

                <label for="productCategories">Categorie prodotto (array):</label>
                <input type="text" id="productCategories" name="productCategories" placeholder="Es. latte, formaggi, yogurt">

                
                <button type="submit">Salva Azienda</button>
            </form>
            <p id="addAziendaMessage" class="status"></p>
        </section>
    </main>


        <script src="/azienda-switcher.js"></script>
        <script src="/add-azienda.js"></script>
        <script src="/logout.js"></script>
</body>
</html>
