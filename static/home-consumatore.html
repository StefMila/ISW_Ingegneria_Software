<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Consumatore - MuccApp</title>
  <!-- Controllo accesso alla pagina: solo gli utenti con ruolo "consumatore" possono accedervi -->
  <script src="/auth-control.js"></script> 
  <script>
    protectRoute(['consumatore']);
  </script>
  <!-- Fine controllo accesso -->
  <link rel="stylesheet" href="/style.css">
</head>
<body class="home-consumatore-page">
<div id="menu-root"></div>
  <!-- script per caricare dinamicamente il menu laterale da menu-consumatore.html, in modo da poterlo condividere tra più pagine senza duplicare il codice -->
   <script>
    fetch('/menu-consumatore.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('menu-root').innerHTML = html;
      })
      .catch(err => {
        console.error('Errore caricamento menu:', err);
      });
  </script>

  <main class="consumer-content">
    <h1>Benvenuto, consumatore!</h1>
    <p>Apri il menu laterale con l'icona in alto a sinistra.</p>
  </main>
</body>
</html>
