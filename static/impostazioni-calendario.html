<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impostazioni Google Calendar - MuccApp</title>
  <script src="/auth-control.js"></script>
  <script>
    protectRoute(['allevatore']);
  </script>
  <script src="/menu-allevatore.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <! header del menù -->
  <main class="dashboard-container-wide">
    <div id="allevatoreHeaderMount"></div>
    <script>
      window.renderAllevatoreHeader({
        showHomeLink: true,
        showEventMenu: true
      });
    </script>
<! -- sezione per l'impostazione del calendario. Connessione OAuth, visualizzazione stato connessione -->
    <section class="section">
      <div class="events-section-header">
        <h2>Impostazioni Google Calendar</h2>
        <div id="connectionBadge" class="status-chip status-chip-warning">Non connesso</div>
      </div>
      <p class="subtitle">Connetti il tuo account Google: MuccApp creerà automaticamente due calendari dedicati (Privato e Pubblico) senza richiedere configurazioni manuali.</p>

      <form id="calendarSettingsForm" class="form events-form">
        <div class="events-grid">
          <div>
            <label for="accountEmail">Account Google</label>
            <input type="email" id="accountEmail" name="accountEmail" placeholder="Viene compilato dopo la connessione OAuth" readonly>
          </div>
          <div>
            <label for="privateCalendarId">Calendario MuccApp Privato</label>
            <input type="text" id="privateCalendarId" name="privateCalendarId" placeholder="Creato automaticamente dopo la connessione" readonly>
          </div>
          <div>
            <label for="publicCalendarId">Calendario MuccApp Pubblico</label>
            <input type="text" id="publicCalendarId" name="publicCalendarId" placeholder="Creato automaticamente dopo la connessione" readonly>
          </div>
        </div>

        <label class="toggle-row" for="connectNow">
          <input type="checkbox" id="connectNow" name="connectNow" disabled>
          <span>Stato connessione (gestito da OAuth Google)</span>
        </label>

        <div class="events-form-actions">
          <button type="button" id="connectGoogleButton">Connetti al tuo Google Calendar</button>
          <button type="button" id="disconnectButton">Disconnetti</button>
          <a class="button-link" href="/eventi-allevatore.html">Vai agli eventi</a>
        </div>
      </form>

      <p id="calendarSettingsMessage" class="status"></p>
    </section>
  </main>

  <script src="/azienda-switcher.js"></script>
  <script src="/impostazioni-calendario.js"></script>
  <script src="/logout.js"></script>
</body>
</html>
