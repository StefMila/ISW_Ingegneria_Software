<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>La tua azienda - Muccapp</title>

        <!-- Controllo ruolo per accesso alla pagina -->
        <script src="/auth-control.js"></script>
        <script>
            protectRoute(['allevatore']);
        </script>
        
        <script src="/menu-allevatore.js"></script>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
<main class="dashboard-container-wide">
            <div id="allevatoreHeaderMount"></div>
        <script>
        window.renderAllevatoreHeader({
            showHomeLink: true,
            showEventMenu: false
        });
        </script>

        <section class="section">
            <div class="azienda-header-inline">
                <h2>Le Mie Aziende Agricole</h2>
                <a href="/registra-azienda.html" class="btn-primary" style="text-decoration: none;">+ Registra Nuova Azienda</a>
            </div>

            <p id="statusMsg" class="status"></p>

            <div class="azienda-card-view">
                <table class="azienda-table" style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="text-align: left; border-bottom: 2px solid #edf2f7; color: #718096;">
                            <th style="padding: 12px;">Ragione Sociale</th>
                            <th style="padding: 12px;">Partita IVA</th>
                            <th style="padding: 12px;">Email</th>
                            <th style="padding: 12px; text-align: right;">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="aziendeTableBody">
                        </tbody>
                </table>
            </div>
        </section>

        <script src="/azienda-switcher.js"></script>
        <script src="/gestione-aziende.js"></script>
        <script src="/logout.js"></script>
        </main>
    </body>
</html>
