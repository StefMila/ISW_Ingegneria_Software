<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth-container">
        <h1>Registrazione</h1>
        <p id="subtitle">Crea un nuovo account</p>
        <form id="signup-form" class="form">
            <label for="name">Nome:</label>
            <input
                type="text" 
                id="name" 
                name="name" 
                placeholder="Inserisci il tuo nome"/>

            <label for="surname">Cognome:</label>
                <input
                    type="text" 
                    id="surname" 
                    name="surname" 
                    placeholder="Inserisci il tuo cognome"/>
            <label for="email">Email:</label>
            <input
                type="email" 
                id="email" 
                name="email" 
                placeholder="Inserisci la tua email"/>
            <label for="password">Password:</label>
            <input
                type="password" 
                id="password" 
                name="password" 
                placeholder="Inserisci la tua password"/>
            <label for="userType">Tipo di utente:</label>
            <select id="userType" name="userType">
                <option value="">Seleziona...</option>
                <option value="allevatore">Allevatore</option>
                <option value="distributore">Distributore</option>
                <option value="veterinario">Veterinario</option>
                <option value="consumatore">Consumatore</option>
            </select>
            <label class="checkbox-container" style="font-size: 14px; line-height: 1;"> 
                <input type="checkbox" id="acceptedTerms" name="acceptedTerms"> Ho visionato e accetto i
                <a href=https://www.unitn.it/ateneo/2077/privacy-e-protezione-dei-dati-personali>Termini e Condizioni</a>
            </label>
            <button type="submit">Registrati</button>
        </form>
        <p id="signupMessage" class="status"></p>
        <p>
            <a href="/login.html">Accedi alla pagina di login</a>
        </p>
    </main>
    <script src="signup.js"></script>
    <script src="/menu-pubblic.js"></script>
</body>
</html>
