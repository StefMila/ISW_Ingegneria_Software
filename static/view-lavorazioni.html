<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizza Lavorazioni - MuccApp</title>
    <!-- Controllo accesso alla pagina, solo gli utenti con ruolo "allevatore" possono accedervi -->
    <script src="/auth-control.js"></script> 
    <script>
        protectRoute(['allevatore']);
    </script>
        <script src="/menu-allevatore.js"></script>
    <!-- Fine controllo accesso -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="dashboard-container-wide">
        <div id="allevatoreHeaderMount"></div>
        <script>
            renderAllevatoreHeader({
                showHomeLink: true,
                showEventMenu: false,
                showDocumentsButton: false
            });
        </script>

        <section class="section">
            <h2>Le tue lavorazioni 🛠️</h2>
            <p id="statusMsg" class="status"></p>
            <!--TODO: dividere template Lavorazione da lavorazioni normali con 2 tabelle diverse (vogliamo evitare il codiceLavorazione nelle lavorazioni non template??)-->

            <div class="table-wrapper">
                <table class="animali-table" id="lavorazioniTable">
                    <thead>
                        <tr class="header-labels">
                            <th>Codice</th>
                            <th>Nome</th>
                            <th>Input</th>
                            <th>Output</th>
                            <th>Azioni</th>
                        </tr>
                    <tr class="header-filters">
                        <th></th>
                        <th>
                            <input type="text" id="filterNomeLavorazione" placeholder="Filtra per nome..." data-filter="nome">
                        </th>
                        <th>
                            <input type="text" id="filterInputLavorazione" placeholder="Filtra per input..." data-filter="input">
                        </th>
                        <th>
                            <input type="text" id="filterOutputLavorazione" placeholder="Filtra per output..." data-filter="output">
                        </th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="lavorazioniTableBody">
                        <!-- Le lavorazioni saranno inserite qui dinamicamente -->
                         <tr>
                             <td colspan="4" class="status">Caricamento lavorazioni...</td>
                         </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="/view-lavorazioni.js"></script>
    <script src="/logout.js"></script>
    <script src="/azienda-switcher.js"></script>
</body>
</html>
