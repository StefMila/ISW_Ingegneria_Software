<!DOCTYPE html>
<html>
  <head>
    <title>Mappa Aziende e Punti Vendita</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="home-consumatore-page">
<div id="menu-root"></div>
     <!-- Filtri rapidi attivabili/disattivabili -->
    <nav class="quick-search-nav" aria-label="Filtri rapidi prodotti ed eventi">
      <button type="button" class="quick-search-link quick-search-reset" data-action="reset-filters">Tutti (aziende + punti vendita + eventi)</button>
      <button type="button" class="quick-search-link filter-toggle" data-filter="latte">Latte 🥛</button>
      <button type="button" class="quick-search-link filter-toggle" data-filter="yogurt">Yogurt 🥣</button>
      <button type="button" class="quick-search-link filter-toggle" data-filter="formaggio">Formaggio 🧀</button>
      <button type="button" class="quick-search-link filter-toggle" data-filter="gelato">Gelato 🍦</button>
      <button type="button" class="quick-search-link filter-toggle" data-filter="eventi">Eventi 🎉</button>
    </nav>
<!-- Barra di ricerca e filtri -->
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Cerca azienda, punto vendita, luogo o categoria...">
      <button onclick="filtraAziende()">Cerca</button>
      <button type="button" id="aroundMeToggle" class="geo-btn" aria-pressed="false" onclick="cercaIntornoAMe()">📍 Intorno a me</button>
      <label style="margin-left:10px;font-size:0.95em;">Raggio:
        <input type="number" id="raggioInput" min="1" max="100" value="10" style="width:55px;"> km
      </label>
    </div>
    <div id="mappaElencoLayout">
      <div id="mapCol">
        <!-- Mappa posizione di apertura -->
        <div id="myMap" aria-label="Mappa aziende e punti vendita"></div>
      </div>
<!-- Elenco aziende trovato -->
      <div id="elencoWrapper">
        <button id="elencoToggleBtn" type="button" onclick="toggleElencoLaterale()" aria-label="Nascondi elenco risultati">&#9664;</button>
        <div id="elencoAziende"></div>
      </div>
    </div>

    <!-- Box per i dettagli del risultato selezionato -->
    <div id="dettaglioAzienda" style="display:none;position:fixed;max-width:420px;width:calc(100vw - 24px);padding:14px;background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.18);font-size:1rem;z-index:30;"></div>
    <script src="/esplora.js"></script>
    <script src="/menu-pubblic.js"></script>
</body>
</html>
