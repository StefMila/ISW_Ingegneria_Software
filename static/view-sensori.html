<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensori IoT - MuccApp</title>
  <script src="/auth-control.js"></script> 
  <script>
    protectRoute(['allevatore']);
  </script>
  <script src="/menu-allevatore.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="dashboard-container">
    <div id="allevatoreHeaderMount"></div>
    <script>
      window.renderAllevatoreHeader({
        showHomeLink: true
      });
    </script>

    <header class="content-header" style="margin-bottom: 2rem;">
      <h1>Monitoraggio Sensori IoT</h1>
      <p class="subtitle">Letture in tempo reale provenienti dai dispositivi della stalla tramite protocollo MQTT.</p>
    </header>

    <section class="section">
      <h2>Telemetria Live</h2>
      <div id="sensoriLiveGrid" class="events-list">
        <p class="status">Caricamento sensori in corso...</p>
      </div>
    </section>
  </main>

  <script src="/azienda-switcher.js"></script>
  <script src="/view-sensori.js"></script>
  <script src="/logout.js"></script>
</body>
</html>
