<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizza Punti Vendita - MuccApp</title>
  <!-- Controllo accesso alla pagina, solo gli utenti con ruolo "allevatore" possono accedervi -->
  <script src="/auth-control.js"></script> 
  <script>
    protectRoute(['allevatore']);
  </script>
    <script src="/menu-allevatore.js"></script>
  <!-- Fine controllo accesso -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="dashboard-container-wide">
    <div id="allevatoreHeaderMount"></div>
    <script>
      renderAllevatoreHeader({
        showHomeLink: true,
        showEventMenu: false,
        showDocumentsButton: false
      });
    </script>

    <section class="section">
      <h2>I tuoi punti vendita 🏪</h2>
      <p id="statusMsg" class="status"></p>

      <div class="table-wrapper">
        <table class="animali-table" id="puntiVenditaTable">
          <thead>
            <tr class="header-labels">
              <th>Attivo</th>
              <th>Nome</th>
              <th>Indirizzo</th>
              <th>Telefono</th>
              <th>Email</th>
              <th>Sito Web</th>
              <th>Categorie prodotto</th>
              <th>Azioni</th>
            </tr>
            <tr class="header-filters">
              <th>
                <select id="filterActivePunto" data-filter="isActive" aria-label="Filtra per stato attivo">
                  <option value="all">Tutti</option>
                  <option value="true">Attivi</option>
                  <option value="false">Non attivi</option>
                </select>
              </th>
              <th>
                <input type="text" id="filterNomePunto" placeholder="Filtra..." data-filter="nomePunto">
              </th>
              <th>
                <input type="text" id="filterIndirizzoPunto" placeholder="Filtra per indirizzo..." data-filter="indirizzo">
              </th>
              <th></th>
              <th></th>
              <th></th>
              <th>
                <input type="text" id="filterCategoriePunto" placeholder="Filtra per categoria..." data-filter="categorie">
              </th>
              <th></th>
            </tr>
          </thead>
          <tbody id="puntiVenditaTableBody">
            <tr class="empty-row">
              <td colspan="8">Caricamento punti vendita...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/view-punti-vendita.js"></script>
  <script src="/azienda-switcher.js"></script>
  <script src="/logout.js"></script>
</body>
</html>
