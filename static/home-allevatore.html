<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Allevatore - MuccApp</title>
  <!-- Controllo accesso alla pagina: solo gli utenti con ruolo "allevatore" possono accedervi -->
  <script src="/auth-control.js"></script> 
  <script>
    protectRoute(['allevatore']);
  </script>
  <script src="/menu-allevatore.js"></script>
  <!-- Fine controllo accesso -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="dashboard-container">
    <div id="allevatoreHeaderMount"></div>
    <script>
      window.renderAllevatoreHeader({
        showHomeLink: false
      });
    </script>

    <section id="section-azienda-attiva" class="section">
      <h2>Azienda Attiva</h2>
      <p id="aziendaSelectionStatus" class="status"></p>
      <div id="aziendaSelectionControls" hidden>
        <label for="aziendaSelector">Seleziona l'azienda</label>
        <select id="aziendaSelector"></select>
        <button id="saveAziendaSelectionButton" type="button">Seleziona azienda</button>
      </div>
    </section>

    <section id="section-prossimi-eventi" class="section">
      <h2>Prossimi eventi</h2>
      <p class="subtitle">I prossimi 3 promemoria per l'azienda attiva.</p>
      <div id="upcomingEventsList" class="events-list">
        <p class="status">Caricamento eventi...</p>
      </div>
    </section>

  </main>

  <script src="/azienda-switcher.js"></script>
  <script src="/home-allevatore.js"></script>
  <script src="/logout.js"></script>
</body>
</html>
