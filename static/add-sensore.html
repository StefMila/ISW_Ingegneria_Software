<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aggiungi Sensore IoT - MuccApp</title>
  <script src="/auth-control.js"></script> 
  <script>protectRoute(['allevatore']);</script>
  <script src="/menu-allevatore.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="dashboard-container">
    <div id="allevatoreHeaderMount"></div>
    <script>
      window.renderAllevatoreHeader({ showHomeLink: true });
    </script>

    <header class="content-header" style="margin-bottom: 2rem;">
      <h1>Collega Nuovo Dispositivo IoT</h1>
      <p class="subtitle">Registra un nuovo sensore per iniziare a ricevere la telemetria.</p>
    </header>

    <section class="section">
      <div class="form-container">
        <form id="formNuovoSensore" class="app-form" style="display: flex; flex-direction: column; gap: 1rem; max-width: 500px; margin: 0 auto;">
          
          <div class="form-group" style="display: flex; flex-direction: column;">
            <label for="iotNome">Nome Identificativo Sensore</label>
            <input type="text" id="iotNome" placeholder="Es. Collare Carolina, Temperatura Silos" required style="padding: 0.5rem; margin-top: 0.2rem;">
          </div>

          <div class="form-group" style="display: flex; flex-direction: column;">
            <label for="iotTipoDispositivo">Tipo Dispositivo</label>
            <select id="iotTipoDispositivo" required style="padding: 0.5rem; margin-top: 0.2rem;">
              <option value="ambientale">Ambientale (Stalla)</option>
              <option value="stoccaggio">Stoccaggio (Silos e Fienili)</option>
              <option value="mungitura">Mungitura (Litri latte)</option>
              <option value="lavorazione">Lavorazione (Kg / Litri)</option>
              <option value="indossabile">Indossabile (Collare / Marca Auricolare)</option>
            </select>
          </div>

          <div class="form-group" style="display: flex; flex-direction: column;">
            <label>Capacità del Dispositivo (Seleziona una o più)</label>
            <div id="iotCapacita" style="margin-top: 0.5rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; background: #fff;">
              <label class="cap-option" data-devices="ambientale,indossabile,stoccaggio" style="display: block; margin-bottom: 0.5rem;">
                <input type="checkbox" value="temperatura" data-unita="°C"> Termometro (°C)
              </label>
              
              <label class="cap-option" data-devices="indossabile" style="display: block; margin-bottom: 0.5rem;">
                <input type="checkbox" value="frequenza_cardiaca" data-unita="bpm"> Cardiofrequenzimetro (bpm)
              </label>
              
              <label class="cap-option" data-devices="indossabile" style="display: block; margin-bottom: 0.5rem;">
                <input type="checkbox" value="livello_passi" data-unita="passi"> Contapassi (Attività)
              </label>
              
              <label class="cap-option" data-devices="indossabile" style="display: block; margin-bottom: 0.5rem;">
                <input type="checkbox" value="esposizione_solare" data-unita="ore"> Sensore Solare (ore)
              </label>
              
              <label class="cap-option" data-devices="indossabile" style="display: block;">
                <input type="checkbox" value="posizione_gps" data-unita="coordinate"> Modulo GPS (Coordinate)
              </label>

              <label class="cap-option" data-devices="mungitura" style="display: block;">
                <input type="checkbox" value="peso" data-unita="litri"> Pesatura (litri)
              </label>

              <label class="cap-option" data-devices="lavorazione" style="display: block;">
                <input type="checkbox" value="peso" data-unita="litri"> Pesatura (litri)
              </label>

              <label class="cap-option" data-devices="lavorazione" style="display: block;">
                <input type="checkbox" value="peso" data-unita="chilogrammi"> Pesatura (Kg)
              </label>
            </div>
          </div>

          <div class="form-group" id="groupAnimaleId" style="display: none; flex-direction: column;">
            <label for="iotAnimaleId">Animale Associato (Tag/ID)</label>
            <select id="iotAnimaleId" style="padding: 0.5rem; margin-top: 0.2rem;">
            </select>
          </div>

          <button type="submit" class="btn-primary" style="padding: 0.7rem; margin-top: 1rem; cursor: pointer;">Registra e Attiva</button>
        </form>
        <p id="formSensoreStatus" class="status" style="margin-top: 0.5rem; font-weight: bold;"></p>
      </div>
    </section>
  </main>

  <script src="/azienda-switcher.js"></script>
  <script src="/add-sensore.js"></script>
  <script src="/logout.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tipoDispositivoSelect = document.getElementById('iotTipoDispositivo');
      const groupAnimale = document.getElementById('groupAnimaleId');
      const animaleSelect = document.getElementById('iotAnimaleId');
      const opzioniCapacita = document.querySelectorAll('.cap-option');

      // Funzione che applica le regole visive
      function aggiornaFormInBaseAlTipo() {
        const tipoSelezionato = tipoDispositivoSelect.value;

        // 1. Gestione della tendina Animale (solo per indossabili)
        if (tipoSelezionato === 'indossabile') {
          groupAnimale.style.display = 'flex';
        } else {
          groupAnimale.style.display = 'none';
          animaleSelect.value = ''; // Resettiamo la mucca se passiamo ad ambientale
        }

        // 2. Gestione dei filtri delle metriche (Checkbox)
        opzioniCapacita.forEach(label => {
          // Leggiamo per quali dispositivi è valido questo sensore
          const dispositiviAmmessi = label.getAttribute('data-devices').split(',');
          const checkbox = label.querySelector('input[type="checkbox"]');

          if (dispositiviAmmessi.includes(tipoSelezionato)) {
            // Se è compatibile, lo mostriamo
            label.style.display = 'block';
          } else {
            // Se non è compatibile, lo nascondiamo e LO DESELEZIONIAMO
            // (importante per evitare di inviare al backend dati fantasma nascosti)
            label.style.display = 'none';
            checkbox.checked = false; 
          }
        });
      }

      // Ascoltiamo i cambiamenti del menu a tendina
      tipoDispositivoSelect.addEventListener('change', aggiornaFormInBaseAlTipo);

      // Lanciamo la funzione una volta al caricamento della pagina 
      // per allineare l'interfaccia al valore di default della tendina
      aggiornaFormInBaseAlTipo();
    });
  </script>
</body>
</html>
