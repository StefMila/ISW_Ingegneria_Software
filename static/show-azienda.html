<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione aziende</title>

    <!-- Controllo ruolo per accesso alla pagina -->
    <script src="/auth-control.js"></script>
    <script>
        protectRoute(['allevatore']);
    </script>
    
    <script src="/menu-allevatore.js"></script>
    <link rel="stylesheet" href="/style.css">

    <style>
        .hidden { display: none !important; }
        .azienda-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .azienda-table th, .azienda-table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .azienda-table th { background-color: #f8fafc; font-weight: 600; color: #475569; }
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 1.1rem; margin-right: 8px; transition: transform 0.1s; }
        .btn-icon:hover { transform: scale(1.15); }
        .btn-disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
    <main class="dashboard-container-wide">
        <div id="allevatoreHeaderMount">
            <script>
            window.renderAllevatoreHeader({
                showHomeLink: true,
                showEventMenu: false
            });
            </script>
        </div>

        <p id="statusMsg" class="status" style="margin: 15px 0; font-weight: bold;"></p>

        <section id="listViewSection" class="section hidden">
            <div class="azienda-header-inline">
                <h2>Le Tue Aziende Agricole</h2>
            </div>
            
            <table class="azienda-table">
                <thead>
                    <tr>
                        <th>Ragione Sociale</th>
                        <th>Indirizzo</th>
                        <th>Data Registrazione</th>
                        <th style="width: 120px; text-align: center;">Azioni</th>
                    </tr>
                </thead>
                <tbody id="farmsTableBody">
                    </tbody>
            </table>
        </section>

        <section id="detailViewSection" class="section hidden">
            <div class="azienda-header-inline">
                <h2 id="detailViewTitle">Dettaglio Azienda Agricola</h2>
                <div id="aziendaActionButtons">
                    <button id="backToListBtn" class="btn-secondary" style="margin-right: 10px;">
                        ← Torna alla lista
                    </button>
                    <button id="editToggleBtn" class="btn-primary">Modifica Dati</button>
                </div>
            </div>

            <div class="azienda-card-view" id="aziendaCard">
                <div class="info-field-group">
                    <label>Ragione Sociale</label>
                    <div class="field-content">
                        <span id="view-companyName" class="view-mode-text">-</span>
                        <input type="text" id="edit-companyName" class="edit-mode-input hidden">
                    </div>
                </div>

                <div class="info-field-group">
                    <label>Partita IVA</label>
                    <div class="field-content">
                        <span id="view-vatNumber" class="view-mode-text">-</span>
                        <input type="text" id="edit-vatNumber" class="edit-mode-input hidden">
                    </div>
                </div>

                <div class="info-field-group">
                    <label>e-mail Azienda</label>
                    <div class="field-content">
                        <span id="view-emailAzienda" class="view-mode-text">-</span>
                        <input type="email" id="edit-emailAzienda" class="edit-mode-input hidden">
                    </div>
                </div>

                <div class="info-field-group">
                    <label>Indirizzo</label>
                    <div class="field-content">
                        <span id="view-address" class="view-mode-text">-</span>
                        <input type="text" id="edit-address" class="edit-mode-input hidden">
                    </div>
                </div>

                <div class="info-field-group">
                    <label>Data di Registrazione</label>
                    <div class="field-content">
                        <span id="view-createdAt" class="view-mode-text">-</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/azienda-switcher.js"></script>
    <script src="/show-azienda.js"></script>
    <script src="/logout.js"></script>
    
</body>
</html>
