<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La tua azienda - Muccapp</title>

    <!-- Controllo ruolo per accesso alla pagina -->
    <script src="/auth-control.js"></script>
    <script>
        protectRoute(['allevatore']);
    </script>
    
    <script src="/menu-allevatore.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="dashboard-container-wide">
        <div id="allevatoreHeaderMount"></div>
    <script>
      window.renderAllevatoreHeader({
        showHomeLink: true,
        showEventMenu: false
      });
    </script>

    <section class="section">
        <div class="azienda-header-inline">
            <h2>Dettaglio Azienda Agricola</h2>
            <div id="aziendaActionButtons">
                <a hrf="/gestione-aziende.html" class="btn-secondary" style="text-decoration: none; margin-right: 10px;">
                    ← Torna all'elenco
                </a>
                <button id="editToggleBtn" class="btn-primary">Modifica Dati</button>
            </div>
        </div>

        <p id="statusMsg" class="status"></p>

        <div class="azienda-card-view" id="aziendaCard">
            <div class="info-field-group">
                <label>Ragione Sociale</label>
                <div class="field-content">
                    <span id="view-companyName" class="view-mode-text">-</span>
                    <input type="text" id="edit-companyName" class="edit-mode-input hidden">
                </div>
            </div>

            <div class="info-field-group">
                <label>Partita IVA</label>
                <div class="field-content">
                    <span id="view-vatNumber" class="view-mode-text">-</span>
                    <input type="text" id="edit-vatNumber" class="edit-mode-input hidden">
                </div>
            </div>

            <div class="info-field-group">
                <label>e-mail Azienda</label>
                <div class="field-content">
                    <span id="view-emailAzienda" class="view-mode-text">-</span>
                    <input type="email" id="edit-emailAzienda" class="edit-mode-input hidden">
                </div>
            </div>

            <div class="info-field-group">
                <label>Indirizzo</label>
                <div class="field-content">
                    <span id="view-address" class="view-mode-text">-</span>
                    <input type="text" id="edit-address" class="edit-mode-input hidden">
                </div>
            </div>

            <div class="info-field-group">
                <label>Data di Registrazione</label>
                <div class="field-content">
                    <span id="view-createdAt" class="view-mode-text">-</span>
                </div>
            </div>
        </div>
    </section>
    </main>

    <script src="/azienda-switcher.js"></script>
    <script src="/view-azienda.js"></script>
    <script src="/logout.js"></script>
    
</body>
</html>
